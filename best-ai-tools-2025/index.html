<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Best AI Tools 2025</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Load data.js first with enhanced error handling -->
    <script>
        // Global error handler for all script errors
        window.addEventListener('error', function(event) {
            console.error('Global error handler caught:', event.message, 'at', event.filename, 'line', event.lineno);
            // Check if it's a data.js error
            if (event.filename && event.filename.includes('data.js')) {
                document.getElementById('error-message').style.display = 'block';
                document.getElementById('error-details').textContent = event.message;
            }
        });
        
        // Function to load data.js with multiple fallback methods
        function loadDataJS() {
            return new Promise((resolve, reject) => {
                console.log("Loading data.js...");
                
                // Method 1: Standard script loading
                const script = document.createElement('script');
                script.src = 'data.js?v=' + new Date().getTime(); // Cache busting
                script.async = false;
                script.onload = () => {
                    console.log("data.js loaded successfully via <script> tag");
                    // Verify data was loaded properly
                    if (window.engineeringTechnicalData) {
                        resolve();
                    } else {
                        console.warn("data.js loaded but data is not available, trying fallback method");
                        loadDataViaFetch().then(resolve).catch(reject);
                    }
                };
                script.onerror = (e) => {
                    console.error("Error loading data.js via <script> tag", e);
                    // Try fallback method if script loading fails
                    loadDataViaFetch().then(resolve).catch(reject);
                };
                document.head.appendChild(script);
            });
        }
        
        // Fallback method to load data via fetch
        function loadDataViaFetch() {
            return new Promise((resolve, reject) => {
                console.log("Trying to load data.js via fetch...");
                fetch('data.js?v=' + new Date().getTime())
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`Network response was not ok: ${response.status}`);
                        }
                        return response.text();
                    })
                    .then(dataJs => {
                        console.log("data.js fetched successfully, evaluating...");
                        try {
                            // Remove any non-ASCII characters that might cause problems
                            dataJs = dataJs.replace(/[^\x00-\x7F]/g, match => {
                                console.log("Replacing special character in fetched data:", match);
                                return encodeURIComponent(match);
                            });
                            
                            // Handle the euro symbol explicitly
                            dataJs = dataJs.replace(/€/g, "EUR"); 
                            
                            // Create blob URL and load as script
                            const blob = new Blob([dataJs], { type: 'application/javascript' });
                            const url = URL.createObjectURL(blob);
                            const blobScript = document.createElement('script');
                            blobScript.src = url;
                            blobScript.onload = () => {
                                console.log("data.js loaded via fetch and blob URL");
                                URL.revokeObjectURL(url);
                                resolve();
                            };
                            blobScript.onerror = (e) => {
                                console.error("Error loading data.js via blob URL", e);
                                // Last resort: eval (with safeguards)
                                try {
                                    console.log("Attempting eval as last resort...");
                                    // Strip any potentially harmful code
                                    if (!dataJs.includes('<script') && !dataJs.includes('document.cookie')) {
                                        window.eval(dataJs);
                                        console.log("data.js loaded via eval");
                                        resolve();
                                    } else {
                                        reject(new Error("Unsafe content detected in data.js"));
                                    }
                                } catch (evalError) {
                                    console.error("Error in eval fallback:", evalError);
                                    reject(evalError);
                                }
                            };
                            document.head.appendChild(blobScript);
                        } catch (error) {
                            console.error("Error processing fetched data.js:", error);
                            reject(error);
                        }
                    })
                    .catch(error => {
                        console.error("Error fetching data.js:", error);
                        reject(error);
                    });
            });
        }

        // Load data.js immediately
        loadDataJS()
            .then(() => {
                console.log("Data loaded successfully:", {
                    engineeringTechnicalData: !!window.engineeringTechnicalData,
                    businessProductivityData: !!window.businessProductivityData,
                    contentMediaData: !!window.contentMediaData,
                    scienceLiteratureData: !!window.scienceLiteratureData
                });
                // Hide error message if it was shown
                document.getElementById('error-message')?.style.display = 'none';
                // Init app when DOM is ready
                if (document.readyState === 'complete' || document.readyState === 'interactive') {
                    initApp();
                } else {
                    document.addEventListener('DOMContentLoaded', initApp);
                }
            })
            .catch(error => {
                console.error("All attempts to load data.js failed:", error);
                document.getElementById('error-message')?.style.display = 'block';
                document.getElementById('error-details')?.textContent = String(error);
            });

        // Add listener for parent window communication
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'loadDataJs') {
                console.log("Received loadDataJs message from parent");
                loadDataJS()
                    .then(() => {
                        event.source.postMessage({ type: 'dataJsLoaded', success: true }, '*');
                    })
                    .catch(error => {
                        event.source.postMessage({ type: 'dataJsLoaded', success: false, error: String(error) }, '*');
                    });
            } else if (event.data && event.data.type === 'checkDataLoaded') {
                const isDataLoaded = !!(window.engineeringTechnicalData && window.businessProductivityData);
                event.source.postMessage({ 
                    type: 'dataLoadedStatus', 
                    loaded: isDataLoaded 
                }, '*');
            }
        });
        
        // Function to initialize the app once data is loaded
        function initApp() {
            console.log("Initializing app...");
            // Check if data is available
            if (!window.engineeringTechnicalData) {
                console.error("Data not available for app initialization");
                document.getElementById('error-message').style.display = 'block';
                return;
            }
            
            // Hide loading indicator if any
            document.getElementById('loading')?.style.display = 'none';
            
            // Show content
            document.getElementById('content')?.style.display = 'block';
        }
    </script>
    <style>
        /* Reset styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* Base styles */
        body, html {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            line-height: 1.6;
            color: #fff;
            background-color: #000;
            overflow-x: hidden;
        }
        
        /* Full-width container */
        .container {
            width: 100%;
            max-width: 100%;
            padding: 0 20px;
            margin: 0 auto;
        }
        
        /* Page title */
        h1 {
            font-size: 1.8rem;
            margin: 20px 0;
            color: #fff;
            text-align: center;
        }
        
        .subtitle {
            font-size: 1rem;
            font-weight: normal;
            color: #64B5F6;
            display: block;
            text-align: center;
            margin-top: 5px;
        }
        
        /* Main layout */
        .sections-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }
        
        .section {
            flex: 1 1 calc(50% - 10px);
            min-width: 300px;
        }
        
        /* Section headers */
        .section-header {
            background-color: #1E293B;
            color: #fff;
            padding: 10px 15px;
            font-weight: bold;
            text-align: left;
            border-radius: 8px 8px 0 0;
            border-bottom: 2px solid #334155;
            margin-bottom: 15px;
        }
        
        /* Category container */
        .category-container {
            margin-bottom: 20px;
        }
        
        /* Category headers */
        .category-header {
            background-color: #1F2937;
            color: #fff;
            padding: 10px 12px;
            font-weight: bold;
            border-bottom: 1px solid #374151;
            display: flex;
            align-items: center;
            border-radius: 8px 8px 0 0;
        }
        
        .category-header .emoji {
            margin-right: 10px;
            font-size: 1.3rem;
        }
        
        /* Level container */
        .level-container {
            margin-bottom: 10px;
        }
        
        .level-name {
            font-size: 0.9rem;
            color: #94A3B8;
            padding: 5px 10px;
            background-color: #1E293B;
            border-bottom: 1px solid #374151;
        }
        
        /* Tool cards */
        .tool-card {
            background-color: #111827;
            border-radius: 8px;
            padding: 12px;
            margin: 8px 5px;
            transition: all 0.3s ease;
            border: 1px solid #1E293B;
            position: relative;
            overflow: hidden;
        }
        
        .tool-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border-color: #3B82F6;
        }
        
        .tool-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, #3B82F6, #8B5CF6);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .tool-card:hover::before {
            opacity: 1;
        }
        
        .tool-name {
            font-weight: 600;
            margin-bottom: 6px;
            color: #fff;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
        }
        
        .tool-name i, .tool-name .icon {
            margin-right: 8px;
            color: #3B82F6;
            font-size: 1.1rem;
        }
        
        .tool-description {
            font-size: 0.9rem;
            color: #94A3B8;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        
        .tool-score {
            display: inline-block;
            padding: 3px 8px;
            background-color: #1E40AF;
            border-radius: 12px;
            font-size: 0.85rem;
            color: #fff;
            font-weight: 500;
        }
        
        .tool-score.high {
            background-color: #059669; /* Green for high scores */
        }
        
        .tool-score.medium {
            background-color: #D97706; /* Orange for medium scores */
        }
        
        .tool-score.low {
            background-color: #DC2626; /* Red for low scores */
        }
        
        .tool-paid-status {
            font-size: 0.8rem;
            color: #94A3B8;
            margin-top: 5px;
            display: block;
        }
        
        .tool-link {
            display: inline-block;
            margin-top: 8px;
            color: #3B82F6;
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.2s ease;
            word-break: break-all;
        }
        
        .tool-link:hover {
            color: #60A5FA;
            text-decoration: underline;
        }
        
        /* Fields container */
        .fields-container {
            background-color: #0F172A;
            border-radius: 0 0 8px 8px;
            padding: 10px;
            border: 1px solid #1E293B;
            border-top: none;
            
            /* Force horizontal layout */
            display: flex !important;
            flex-direction: row !important;
            flex-wrap: nowrap !important;
            overflow-x: auto !important;
            gap: 1rem !important;
        }
        
        /* Field column */
        .field-column {
            /* Force fixed width */
            flex: 0 0 250px !important;
            min-width: 250px !important;
            width: 250px !important;
            margin-right: 1rem !important;
            display: block !important;
            
            background-color: #1E293B;
            border-radius: 8px;
            overflow: hidden;
        }
        
        /* Custom logo styling */
        .custom-logo {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            border-radius: 4px;
        }
        
        /* Detailed scores display */
        .detailed-scores {
            display: flex;
            gap: 8px;
            margin-top: 5px;
            flex-wrap: wrap;
        }
        
        .score-item {
            font-size: 0.75rem;
            color: #94A3B8;
        }
        
        .score-item span {
            font-weight: 600;
            color: #3B82F6;
        }
        
        /* Tooltip styles */
        .tooltip {
            position: absolute;
            background-color: #1F2937;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            pointer-events: none;
            max-width: 300px;
            border: 1px solid #3B82F6;
            font-size: 0.9rem;
            color: #E5E7EB;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        
        .tooltip.visible {
            opacity: 1;
        }
        
        .tooltip .score {
            display: inline-block;
            padding: 3px 8px;
            background-color: #1E40AF;
            border-radius: 12px;
            font-size: 0.85rem;
            color: #fff;
            margin-top: 8px;
            font-weight: 500;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .sections-container {
                flex-direction: column;
            }
            
            .section {
                flex: 1 1 100%;
            }
            
            .container {
                padding: 0 10px;
            }
        }
        
        /* Only on very small screens, allow wrapping */
        @media (max-width: 480px) {
            .fields-container {
                flex-wrap: wrap !important;
            }
            
            .field-column {
                flex: 1 0 100% !important;
                width: 100% !important;
                margin-right: 0 !important;
            }
        }
        
        /* Error message styles */
        #error-message {
            display: none;
            background-color: #DC2626;
            color: white;
            padding: 15px;
            margin: 20px auto;
            border-radius: 8px;
            max-width: 90%;
            text-align: center;
        }
        
        #error-details {
            margin-top: 10px;
            font-family: monospace;
            padding: 10px;
            background-color: rgba(0,0,0,0.2);
            border-radius: 4px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        /* Loading indicator */
        #loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 50vh;
            color: #64B5F6;
        }
        
        .spinner {
            border: 4px solid rgba(0,0,0,0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #64B5F6;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p>Loading AI Tools data...</p>
    </div>
    
    <div id="error-message">
        <h2>Error Loading Data</h2>
        <p>There was a problem loading the AI tools data. Please try refreshing the page.</p>
        <div id="error-details"></div>
    </div>
    
    <div id="content" style="display:none;">
        <div class="container">
            <h1>🚀 My review for best AI Tools 2025 with Scores !</h1>
            <span class="subtitle">[by personal analysis + deepsearch , Scores are on /10 ] update 9th March 2025</span>
            
            <div id="ai-tools-container">
                <!-- Content will be dynamically generated by JavaScript -->
                <p style="text-align: center; padding: 20px;">Loading AI Tools data...</p>
            </div>
        </div>
    </div>
    
    <script src="data.js"></script>
    <script>
        // Add a function to fix layout issues
        function fixHorizontalLayout() {
            console.log("Fixing horizontal layout...");
            
            // Force horizontal layout for all fields containers
            document.querySelectorAll('.fields-container').forEach(container => {
                container.style.display = 'flex';
                container.style.flexDirection = 'row';
                container.style.flexWrap = 'nowrap';
                container.style.overflowX = 'auto';
                container.style.gap = '1rem';
            });
            
            // Force fixed width for all field columns
            document.querySelectorAll('.field-column').forEach(column => {
                column.style.flex = '0 0 250px';
                column.style.minWidth = '250px';
                column.style.width = '250px';
                column.style.marginRight = '1rem';
                column.style.display = 'block';
            });
        }
        
        // Run the fix function after a delay
        setTimeout(fixHorizontalLayout, 500);
        
        // Also run it after the page has fully loaded
        window.addEventListener('load', function() {
            fixHorizontalLayout();
            setTimeout(fixHorizontalLayout, 1000);
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
