    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background-color: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      }
      .ai-tools-container {
        width: 100vw;
        max-width: 100vw;
        height: 100vh;
        position: relative;
        left: 50%;
        transform: translateX(-50%);
        overflow: hidden;
      }
      .ai-tools-iframe {
        width: 100%;
        height: calc(100vh - 80px);
        border: none;
        overflow-y: visible;

      }
      #loading-indicator, #error-message {
        display: none;
        text-align: center;
        margin-top: 40vh;
      }
      .spinner {
        border: 4px solid rgba(255,255,255,0.3);
        border-radius: 50%;
        border-top: 4px solid #3B82F6;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      #error-message {
        color: #EF4444;
        max-width: 600px;
        margin: 40vh auto 0;
      }
      #retry-button {
        background-color: #3B82F6;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 20px;
        font-weight: bold;
      }
      #retry-button:hover {
        background-color: #2563EB;
      }
      #direct-data-load {
        margin-top: 15px;
        font-size: 0.9em;
        display: none;
      }

<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript>
      <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-XXXXXXX" height="0" width="0" style="display:none;visibility:hidden"></iframe>
    </noscript>
    <!-- End Google Tag Manager (noscript) -->
    
    <main>
      <div class="ai-tools-container">
        <iframe id="ai-tools-iframe" src="/best-ai-tools-2025/index.html" class="ai-tools-iframe" title="Best AI Tools 2025"></iframe>
        
        <div id="loading-indicator">
          <div class="spinner"></div>
          <p>Loading AI Tools data...</p>
        </div>
        
        <div id="error-message">
          <h2>Error Loading AI Tools</h2>
          <p>There was a problem loading the AI tools data. The issue could be:</p>
          <ul style="text-align: left; max-width: 500px; margin: 15px auto;">
            <li>Temporary network issue</li>
            <li>Browser cache problem</li>
            <li>Content blocking by browser extensions</li>
          </ul>
          <button id="retry-button" onclick="window.location.reload()">Retry Loading</button>
          <div id="direct-data-load">
            <p>If problems persist, try <a href="#" onclick="loadDataDirectly(); return false;" style="color: #3B82F6;">loading data directly</a>.</p>
          </div>
        </div>
      </div>
    </main>

    <script>
      // Show loading indicator initially
      document.getElementById('loading-indicator').style.display = 'block';
      
      // Function to check if iframe loaded successfully
      function checkIframeLoaded() {
        const iframe = document.getElementById('ai-tools-iframe');
        let attempts = 0;
        const maxAttempts = 3;
        
        function check() {
          try {
            // Try to access the iframe's contentWindow and check data
            const iframeWindow = iframe.contentWindow;
            
            // First check if we can access contentWindow at all
            if (!iframeWindow) {
              throw new Error('Cannot access iframe contentWindow - possible CORS issue');
            }
            
            // Try to send a message to check if data is loaded
            iframeWindow.postMessage({ type: 'checkDataLoaded' }, '*');
            
          } catch (error) {
            console.error('Error checking iframe:', error);
            attempts++;
            
            if (attempts >= maxAttempts) {
              showError();
              // Show direct data load option after multiple failed attempts
              document.getElementById('direct-data-load').style.display = 'block';
            } else {
              // Try again after a delay
              setTimeout(check, 2000);
            }
          }
        }
        
        // Start checking after iframe should be loaded
        setTimeout(check, 3000);
      }
      
      // Function to show error message
      function showError() {
        document.getElementById('loading-indicator').style.display = 'none';
        document.getElementById('error-message').style.display = 'block';
        document.getElementById('ai-tools-iframe').style.display = 'none';
      }
      
      // Function to load data directly into the parent page
      function loadDataDirectly() {
        try {
          console.log('Attempting to load data directly into parent page');
          const script = document.createElement('script');
          script.src = '/best-ai-tools-2025/data.js?v=' + new Date().getTime();
          script.onerror = function(e) {
            console.error('Error loading data.js directly:', e);
            alert('Could not load data directly. Please try refreshing the page.');
          };
          script.onload = function() {
            // Check if data was loaded
            if (window.engineeringTechnicalData) {
              console.log('Data loaded directly into parent page');
              alert('Data loaded successfully. Please refresh the page to see the tools.');
            } else {
              console.error('Data script loaded but no data available');
              alert('Data could not be loaded. Please try again later.');
            }
          };
          document.head.appendChild(script);
        } catch (error) {
          console.error('Error in loadDataDirectly:', error);
          alert('An error occurred while trying to load data: ' + error.message);
        }
      }
      
      // Listen for messages from the iframe
      window.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'dataLoadedStatus') {
          console.log('Received dataLoadedStatus:', event.data);
          if (event.data.loaded) {
            // Data loaded successfully
            document.getElementById('loading-indicator').style.display = 'none';
          } else {
            // Data failed to load in iframe
            showError();
          }
        }
      });
      
      // Check iframe after page load
      window.addEventListener('load', function() {
        checkIframeLoaded();
        
        // If still showing loading after 8 seconds, assume error
        setTimeout(function() {
          if (document.getElementById('loading-indicator').style.display !== 'none') {
            showError();
          }
        }, 8000);
      });
    </script>
